		'                    <img src="https://cloud.adjust-digital.com/creatives/b2e86984205ae08c2ebec7267d62cb1d/assets/prod5_splash.png" class="topLeft prod_splash" id="prod5_splash" />' +
		'' +
		'                    <img src="https://cloud.adjust-digital.com/creatives/b2e86984205ae08c2ebec7267d62cb1d/assets/prod6_txt.png" class="topLeft full_width prod_txt" id="prod6_txt" />' +
		'                    <img src="https://cloud.adjust-digital.com/creatives/b2e86984205ae08c2ebec7267d62cb1d/assets/prod6.png" class="topLeft full_width prod" id="prod6" />' +
		'                    <img src="https://cloud.adjust-digital.com/creatives/b2e86984205ae08c2ebec7267d62cb1d/assets/prod6_splash.png" class="topLeft prod_splash" id="prod6_splash" />' +
		'                </div>' +
		'' +
		'                <img src="https://cloud.adjust-digital.com/creatives/b2e86984205ae08c2ebec7267d62cb1d/assets/logo.png" class="topLeft banner_size" id="logo" />' +
		'' +
		'                <div class="topLeft btn_container alphaNone" onmouseover="btn_container_mouseover();"' +
		'                    onmouseout="btn_container_mouseout();">' +
		'                    <div class="topLeft full_width full_height btn_normal_container">' +
		'                        <img src="https://cloud.adjust-digital.com/creatives/b2e86984205ae08c2ebec7267d62cb1d/assets/btn_n.png" class="topLeft full_width btn_normal" />' +
		'                    </div>' +
		'                    <div class="topLeft alphaNone full_width full_height btn_hover_container">' +
		'                        <img src="https://cloud.adjust-digital.com/creatives/b2e86984205ae08c2ebec7267d62cb1d/assets/btn_h.png" class="topLeft full_width btn_hover" />' +
		'                    </div>' +
		'                </div>' +
		'' +
		'                <div class="topLeft alphaNone" id="delay"></div>' +
		'' +
		'            ';
		document.getElementById('preload').innerHTML = preloadContent;
		bb.preload();

        }

        function preloadDone() {

            //STANDARD ELEMENT RESET//
            gsap.set(logo, { alpha: 1, transformOrigin: "0px 0px" });
            gsap.set(".btn_container", { alpha: 1, transformOrigin: "50% 50%" });
            gsap.set(prod_container, { alpha: 1 });

            //RESET//
            tlMain.set(".prod_txt", { x: -bannerWidth, alpha: 0 });
            tlMain.set(".prod", { x: bannerWidth, alpha: 0 });
            tlMain.set(prod6, { x: -bannerWidth, alpha: 0 });
            tlMain.set(".prod_splash", { x: 0, scale: 2, alpha: 0 });

            tlMain.set(superr, { scale: 0.8, alpha: 0, transformOrigin: "50% 50%" });
            tlMain.set(dage, { scale: 0.8, alpha: 0, transformOrigin: "50% 50%" });
            tlMain.set(udraabstegn, { scale: 0.2, alpha: 0, transformOrigin: "80% 65%" });
            tlMain.set(duper, { scale: 0.2, alpha: 0, transformOrigin: "80% 65%" });
            tlMain.set(swoosh1, { scale: 0, alpha: 0, transformOrigin: "12% 65%" });
            tlMain.set(swoosh2, { scale: 0, alpha: 0, transformOrigin: "15% 70%" });
            tlMain.set(swoosh3, { scale: 0, alpha: 0, transformOrigin: "14% 68%" });
            tlMain.set(dato_26, { transformOrigin: "35% 96%", transformPerspective: 600 });
            tlMain.set(dato_27, { transformOrigin: "40% 94%", transformPerspective: 600 });
            tlMain.set(dato_28, { transformOrigin: "45% 92%", transformPerspective: 600 });
            tlMain.set(dato_29, { transformOrigin: "50% 90%", transformPerspective: 600 });

            //PLAY//
            tlMain.to(".superdage_in", { alpha: 1, ease: "expo", duration: 0.3, delay: 0.2 });
            tlMain.to(".superdage_in2", { scale: 1, alpha: 1, stagger: 0.15, ease: "elastic(0.8)", duration: 0.7, delay: -0.4 });
            tlMain.to(".swoosh", { scale: 1, alpha: 1, stagger: 0.1, ease: "elastic(0.5)", duration: 0.7, delay: -0.6, onComplete: tlCheckCount });

            tlMain.to(".dato_scale", { scale: 1.2, stagger: 0.06, ease: "back.inOut", duration: 0.7 });
            tlMain.to(".dato_scale", { scale: 1, stagger: 0.06, ease: "back.inOut", duration: 0.8 }, "-=0.4");

            tlMain.to(".btn_container", { scale: 0.9, ease: "none", duration: 0.2, delay: 0 });
            tlMain.to(".btn_container", { scale: 1, ease: "none", duration: 0.2, delay: 0 });
            tlMain.to(".btn_container", { scale: 0.9, ease: "none", duration: 0.2, delay: 0 });
            tlMain.to(".btn_container", { scale: 1, ease: "none", duration: 0.2, delay: 0 });

            tlMain.to(superdage_container, { scale: 0.6, alpha: 0, x: "-50%", y: "-30%", ease: "quad.in", duration: 0.5, delay: 0 });
            tlMain.to(txt1, { alpha: 1, ease: "quad.in", duration: 0.5, delay: -0.2 });


            // RANDOM PRODUKTER //
            addProductAnimation(ro[0]);
            addProductAnimation(ro[1]);
            addProductAnimation(ro[2]);


            tlMain.set(delay, { delay: 0.1 });



            document.getElementById("container").onmouseover = bb.mouseOver;
            document.getElementById("container").onmouseout = bb.mouseOut;

            bb.viewportListen();
        }

        function inViewport() {
            if (!hasBeenInViewPort) {
                hasBeenInViewPort = true;
                bannerStartTime = performance.now();
                tlMain.restart();
            }
        }

        function addProductAnimation(productNumber) {
            var productTxt = "#prod" + productNumber + "_txt";
            var product = "#prod" + productNumber;
            var productSplash = "#prod" + productNumber + "_splash";

            tlMain.to(productTxt, { x: 0, alpha: 1, ease: "expo", duration: 0.5, delay: 0 });
            tlMain.to(product, { x: 0, alpha: 1, ease: "expo", duration: 0.5, delay: -0.5 });
            tlMain.to(productSplash, { x: 0, scale: 1, alpha: 1, ease: "quad.in", duration: 0.2, delay: 0 });

            tlMain.to(".btn_container", { scale: 0.9, ease: "none", duration: 0.2, delay: 0 });
            tlMain.to(".btn_container", { scale: 1, ease: "none", duration: 0.2, delay: 0 });
            tlMain.to(".btn_container", { scale: 0.9, ease: "none", duration: 0.2, delay: 0 });
            tlMain.to(".btn_container", { scale: 1, ease: "none", duration: 0.2, delay: 0 });

            tlMain.to(productTxt, { x: bannerWidth, alpha: 0, ease: "expo.in", duration: 0.5, delay: 1 });
            tlMain.to(product, { x: -bannerWidth, alpha: 0, ease: "expo.in", duration: 0.5, delay: -0.5 });
            tlMain.to(productSplash, { x: -bannerWidth, alpha: 0, ease: "expo.in", duration: 0.5, delay: -0.5 });
        }

        function shuffleArray(arr) {
            var array = arr.slice();

            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }

            return array;
        }

        function tlMainRestart() {
            counterMain++;
            tlMain.restart();
        }


        function tlCheckCount() {
            if (counterMain == 2) {
                tlMain.pause();
            }
            // bannerAnimationTime();
        }



        function mouseOverListener() {
            btn_container_mouseover();
        }

        function mouseOutListener() {
            btn_container_mouseout();
        }

        function btn_container_mouseover() {
            gsap.to(".btn_normal_container", { alpha: 0, duration: 0.1, delay: 0.1 });
            gsap.to(".btn_hover_container", { alpha: 1, duration: 0.1, delay: 0.1 });
        }

        function btn_container_mouseout() {
            gsap.to(".btn_normal_container", { alpha: 1, duration: 0.1, delay: 0.1 });
            gsap.to(".btn_hover_container", { alpha: 0, duration: 0.1, delay: 0.1 });
        }

        function bannerAnimationTime() {
            var bannerEndTime = performance.now();
            console.log((bannerEndTime / 1000.0) - (bannerStartTime / 1000.0));
        }

        var lastClick = new Date().getTime();

        function ignoreClick() {
            lastClick = new Date().getTime();
        }

        function redir(clickTagNum, url, itemId) {

            if (lastClick + 500 > new Date().getTime()) {
                return;
            }
            lastClick = new Date().getTime();

            if (clickTagNum == undefined) {
                clickTagNum = 1;
            }
            if (url != undefined) {
                bb.openUrl(clickTagNum, url, itemId);
            } else {
                bb.open(clickTagNum);
            }
        }

    </script>
</body>
